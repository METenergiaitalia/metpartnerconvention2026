<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Diagnostica endpoint MET UP!</title>
<style>
body{font-family:ui-monospace,Menlo,monospace;background:#00242f;color:#d7ecf2;padding:24px;font-size:13px;line-height:1.6}
h1{font-family:system-ui,sans-serif;font-size:17px;color:#88d2e7;margin:0 0 4px}
p.sub{font-family:system-ui,sans-serif;color:#7fa3b0;margin:0 0 18px;font-size:12.5px}
.t{border:1px solid #10485c;border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#012c3a}
.t b{display:block;color:#fff;font-family:system-ui,sans-serif;margin-bottom:6px}
.ok{color:#8fe06a}.ko{color:#ff8b7a}.wait{color:#F4c400}
pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-all;color:#9fc3ce}
</style>
</head>
<body>
<h1>Diagnostica endpoint MET UP!</h1>
<p class="sub">Chiama il backend Google e mostra la risposta esatta. Nessun dato reale viene registrato: usa un'email di test.</p>
<div id="out"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwe73rzaMn1kSYBS5CS6apRokcKlxM0WGMLx7M1sXYGMuF5eEw8J7BcALun-sKv9X9L/exec';
const API_TOKEN = 'metup26_w_gZRbWG9mNOFjwMZBjEyuYx545PogJVqZ00QKZBlm';
const out = document.getElementById('out');

function box(title){
  const d = document.createElement('div');
  d.className = 't';
  d.innerHTML = '<b>' + title + '</b><span class="wait">in corso…</span>';
  out.appendChild(d);
  return d;
}
function done(d, ok, msg, raw){
  d.innerHTML = d.querySelector('b').outerHTML
    + '<span class="' + (ok ? 'ok' : 'ko') + '">' + msg + '</span>'
    + (raw ? '<pre>' + raw.replace(/</g,'&lt;').slice(0,900) + '</pre>' : '');
}

async function run(){
  // TEST 1 — GET semplice: verifica che la Web App risponda ed esista
  let d = box('1 · La Web App risponde?');
  try{
    const r = await fetch(API_URL + '?token=' + encodeURIComponent(API_TOKEN));
    const txt = await r.text();
    if (txt.trim().startsWith('<')) done(d, false, 'HTTP ' + r.status + ' — risposta HTML invece di JSON: la Web App chiede un login. Ripubblicala con «Chi ha accesso: Chiunque».', txt);
    else done(d, true, 'HTTP ' + r.status + ' — risposta ricevuta', txt);
  }catch(e){
    done(d, false, 'Chiamata bloccata: ' + e.message + ' — URL errato, distribuzione non pubblica o CORS.', '');
  }

  // TEST 2 — POST con token errato: deve rispondere unauthorized
  d = box('2 · Il token viene controllato?');
  try{
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({token:'token-sbagliato', action:'registrazione', data:{}})});
    const txt = await r.text();
    done(d, txt.includes('unauthorized'), txt.includes('unauthorized') ? 'Corretto: rifiutato' : 'Risposta inattesa', txt);
  }catch(e){ done(d, false, 'Errore: ' + e.message, ''); }

  // TEST 3 — POST reale di prova
  d = box('3 · Scrittura di una riga di prova');
  try{
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({token:API_TOKEN, action:'registrazione', data:{
        nome:'Test', cognome:'Diagnostica', agenzia:'TEST — da cancellare',
        email:'test-' + Date.now() + '@example.com', nascitaData:'1990-01-01', nascitaLuogo:'Verona',
        residenza:'Verona', docNumero:'TEST000', docLuogo:'Verona', docData:'2020-01-01',
        dietaTipi:[], dietaNote:'', note:'Riga di diagnostica: cancellare dal foglio.'}})});
    const txt = await r.text();
    let ok = false; try{ ok = JSON.parse(txt).ok === true; }catch(_){}
    done(d, ok, ok ? 'Riga scritta: controlla il foglio Partecipanti' : 'Il backend ha risposto con un errore', txt);
  }catch(e){ done(d, false, 'Errore: ' + e.message, ''); }
}
run();
</script>
</body>
</html>
